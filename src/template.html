<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neverland · 宋二</title>
<meta name="description" content="Neverland · 2005–2011 年的 {{postCount}} 篇博客存档">
<style>
{{styles}}
</style>
<script>
/* 在首次绘制前定好配色，避免切过的访客看到一闪的浅色。
   file:// 下 Chrome 会禁掉 localStorage，所以整段包在 try 里。 */
try{var t=localStorage.getItem('theme');
 if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
</script>
</head><body>
<header><div class="wrap hd">
  <div class="brand"><img id="ava" src="avatar.jpg" alt="" onerror="this.style.display='none'">
    <span>Neverland<small>2005 – 2011</small></span></div>
  <nav>
    <button data-v="time">时间轴</button>
    <button data-v="photo">相册</button>
    <button data-v="series">系列</button>
    <button data-v="wall">留言板</button>
  </nav>
  <input id="q" placeholder="搜索全文…" autocomplete="off">
  <button id="theme" type="button" aria-label="配色"></button>
</div></header>
<main><div class="wrap" id="main"></div></main>
<footer><div class="wrap">
  <div>Neverland · 共 {{postCount}} 篇 · 原载于新浪博客 · 本站为离线存档</div>
  <div class="hits"><span>本站访问</span><img
    src="https://hits.sh/songer522.github.io/blog.svg?style=plastic&label=&color=e8e6e2&labelColor=fbfaf8"
    alt="" onerror="this.closest('.hits').style.display='none'"></div>
</div></footer>
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css">
<div class="lb" id="lb"><img id="lbi" alt="">
  <button class="lbnav" id="lbp" aria-label="上一张">‹</button>
  <button class="lbnav" id="lbn" aria-label="下一张">›</button>
  <button id="lbx" aria-label="关闭">×</button>
  <div class="lbcount" id="lbc"></div>
</div>
<button class="top" id="top" aria-label="回到顶部" title="回到顶部">↑</button>
<div class="player" id="player" hidden>
  <audio id="pa" preload="metadata"></audio>
  <button type="button" class="player-fab" id="pfab" aria-label="展开播放器" aria-expanded="false">▶</button>
  <div class="player-panel" id="ppanel">
    <div class="player-head">
      <div class="player-meta">
        <div class="player-title" id="ptitle"></div>
        <div class="player-artist" id="partist"></div>
      </div>
      <button type="button" class="player-collapse" id="pcollapse" aria-label="收起">▾</button>
    </div>
    <input class="player-seek" id="pseek" type="range" min="0" max="1000" value="0" step="1" aria-label="进度">
    <div class="player-controls">
      <button type="button" id="pprev" aria-label="上一首">‹</button>
      <button type="button" class="player-toggle" id="ptoggle" aria-label="播放">▶</button>
      <button type="button" id="pnext" aria-label="下一首">›</button>
    </div>
  </div>
</div>
{{data}}
<script>
{{app}}
</script>
</body></html>
